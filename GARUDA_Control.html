<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <title>GARUDA Control</title>
  <style>
/* ===== UKURAN: ubah di sini kalau mau lebih besar / kecil ===== */
:root{
  --d:min(33vw,calc(100vh - 72px));      /* diameter lingkaran kendali */
  --rb:clamp(54px,19vh,72px);            /* tombol bulat lengan & capit */
  --tb:50px;                             /* tombol bulat atas (koneksi) */
}
@supports (height:100dvh){
  :root{--d:min(33vw,calc(100dvh - 72px));--rb:clamp(54px,19dvh,72px)}
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation}
html,body{height:100%;overflow:hidden;background:#000;color:#fff;font:13px/1.3 "Bahnschrift","Segoe UI",system-ui,sans-serif}
#app{position:fixed;inset:0}

/* baris atas */
#top{position:absolute;left:12px;right:12px;top:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;z-index:2}
#chips{display:flex;gap:8px;flex-wrap:nowrap;min-width:0}
.grp{display:flex;gap:8px;align-items:center;flex:none}
.chip{display:flex;align-items:center;gap:7px;background:#031917;border:1px solid #0b3a32;border-radius:16px;padding:8px 12px;min-width:0;white-space:nowrap}
.chip svg{width:20px;height:20px;flex:none;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chip b{font-size:15px;font-weight:700}
.chip small{font-size:11px;color:#8fb8ad}
.chip.ok b{color:#5ef0b8}.chip.warn b{color:#f0c050}.chip.bad b{color:#ff6b6b}
.rbtn{width:var(--tb);height:var(--tb);border-radius:50%;background:#031917;border:1px solid #0b3a32;color:#fff;display:flex;align-items:center;justify-content:center;position:relative;flex:none;cursor:pointer}
.rbtn svg{width:46%;height:46%;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.rbtn.on,.rbtn:active{background:#2fbf94;color:#00150f;border-color:#2fbf94}
#conn .badge{position:absolute;right:-2px;bottom:-2px;width:19px;height:19px;border-radius:50%;background:#ff6b6b;color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
#conn.ok .badge{background:#2fbf94;color:#00150f}
#stop{height:var(--tb);padding:0 18px;border-radius:25px;background:#3a1010;border:1px solid #ff6b6b;color:#ff6b6b;font:800 15px/1 "Bahnschrift","Segoe UI",system-ui,sans-serif;letter-spacing:.05em;touch-action:none;cursor:pointer}
#stop:active{background:#ff6b6b;color:#fff}

/* lingkaran kendali */
.pad{position:absolute;bottom:8px;width:var(--d);height:var(--d);border-radius:50%;overflow:hidden;
  background:radial-gradient(circle at 50% 50%,#020b0a 0%,#03120f 42%,#0a3d30 72%,#1f9e78 100%);
  box-shadow:0 0 0 1px #0c4a3a inset,0 0 26px rgba(31,158,120,.28)}
#padL{left:12px}
#padR{right:12px}
.half{position:absolute;background:transparent;border:0;color:#fff;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:pointer}
.half.on{background:rgba(70,255,190,.22)}
#padL .up{left:0;right:0;top:0;height:50%}
#padL .dn{left:0;right:0;bottom:0;height:50%}
#padR .lf{top:0;bottom:0;left:0;width:50%}
#padR .rt{top:0;bottom:0;right:0;width:50%}
.divH{position:absolute;left:12%;right:12%;top:50%;height:1px;background:linear-gradient(90deg,transparent,#bbb,transparent);pointer-events:none}
.divV{position:absolute;top:12%;bottom:12%;left:50%;width:1px;background:linear-gradient(180deg,transparent,#bbb,transparent);pointer-events:none}
.chev{width:38%;height:auto;stroke:#fff;stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}

/* tengah */
#mid{position:absolute;top:60px;bottom:8px;left:calc(var(--d) + 20px);right:calc(var(--d) + 20px);display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:8px;min-width:0}
#svs{flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px}
.sv{display:grid;grid-template-columns:auto auto auto;gap:8px;align-items:center;justify-content:center}
.sv .nm{display:flex;flex-direction:column;line-height:1.25;min-width:50px}
.sv .nm span{font-size:14px;font-weight:700}
.sv .nm small{font-size:13px;color:#5ef0b8}
.sv .rbtn{width:var(--rb);height:var(--rb);touch-action:none}

/* bar F1-F4 */
#fwrap{width:min(100%,270px);display:flex;flex-direction:column;align-items:center;gap:2px}
#ftab{width:64px;height:18px;border:0;background:#031917;border-radius:10px 10px 0 0;display:flex;align-items:center;justify-content:center;cursor:pointer}
#ftab svg{width:16px;height:16px;stroke:#fff;stroke-width:2.4;fill:none;stroke-linecap:round;transition:transform .2s}
#fwrap.hide #ftab svg{transform:rotate(180deg)}
#fbar{width:100%;display:flex;gap:4px;background:#031917;border:1px solid #0b3a32;border-radius:16px;padding:5px}
#fwrap.hide #fbar{display:none}
.fb{flex:1;border:0;background:transparent;color:#cfe8e0;font:800 19px/1 "Bahnschrift","Segoe UI",system-ui,sans-serif;letter-spacing:.04em;padding:15px 0;border-radius:12px;cursor:pointer}
.fb.on{background:#16705a;color:#fff}

/* kotak IP */
#ipov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:8;align-items:center;justify-content:center}
#ipov.show{display:flex}
#ipbox{background:#031917;border:1px solid #0b3a32;border-radius:14px;padding:14px;width:min(420px,92vw)}
#ipbox h3{font-size:14px;margin-bottom:8px}
#ipbox input{width:100%;background:#000;border:1px solid #0b3a32;color:#fff;border-radius:8px;padding:10px;font-size:15px;-webkit-user-select:text;user-select:text}
#ipbox .row{display:flex;gap:8px;margin-top:10px}
#ipbox button{flex:1;background:#16705a;color:#fff;border:0;border-radius:8px;padding:12px;font-size:14px;font-weight:700;cursor:pointer}
#ipbox button.g{background:#21262d}
#ipst{font-size:12px;color:#8fb8ad;margin-top:8px}

#rot{display:none;position:fixed;inset:0;background:#000;z-index:9;align-items:center;justify-content:center;text-align:center;padding:20px;font-size:16px}
@media (orientation:portrait) and (max-width:900px){#rot{display:flex}}
  </style>
</head>
<body>
  <div id="rot">Putar HP ke mode landscape</div>

  <div id="app">
    <div id="top">
      <div id="chips">
        <div class="chip" id="cTemp">
          <svg viewBox="0 0 24 24"><path d="M10 14.5V5a2 2 0 1 1 4 0v9.5a4 4 0 1 1-4 0z"/></svg>
          <b id="obj">--</b><small id="amb"></small>
        </div>
        <div class="chip" id="cTime">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          <b id="jam">--:--:--</b>
        </div>
        <div class="chip" id="cSd">
          <svg viewBox="0 0 24 24"><path d="M7 3h7l4 4v14H7z"/><path d="M10 3v4M13 3v4"/></svg>
          <b id="sdtxt">-</b>
        </div>
      </div>
      <div class="grp">
        <button id="stop" aria-label="Stop darurat">STOP</button>
        <button class="rbtn" id="conn" aria-label="Koneksi robot">
          <svg viewBox="0 0 24 24"><path d="M12 22v-5M9 8V2M15 8V2M18 8v5a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V8z"/></svg>
          <span class="badge" id="badge">&times;</span>
        </button>
      </div>
    </div>

    <div class="pad" id="padL">
      <button class="half up" data-k="u" aria-label="Maju"><svg class="chev" viewBox="0 0 24 24"><polyline points="4,16 12,8 20,16"/></svg></button>
      <button class="half dn" data-k="d" aria-label="Mundur"><svg class="chev" viewBox="0 0 24 24"><polyline points="4,8 12,16 20,8"/></svg></button>
      <div class="divH"></div>
    </div>

    <div id="mid">
      <div id="svs">
        <div class="sv">
          <div class="nm"><span>Lengan</span><small id="angL">-</small></div>
          <button class="rbtn" data-h="W" aria-label="Lengan naik"><svg viewBox="0 0 24 24"><polyline points="5,15 12,8 19,15"/></svg></button>
          <button class="rbtn" data-h="U" aria-label="Lengan turun"><svg viewBox="0 0 24 24"><polyline points="5,9 12,16 19,9"/></svg></button>
        </div>
        <div class="sv">
          <div class="nm"><span>Capit</span><small id="angC">-</small></div>
          <button class="rbtn" data-h="X" aria-label="Capit buka"><svg viewBox="0 0 24 24"><polyline points="9,6 3,12 9,18"/><polyline points="15,6 21,12 15,18"/></svg></button>
          <button class="rbtn" data-h="V" aria-label="Capit tutup"><svg viewBox="0 0 24 24"><polyline points="3,6 9,12 3,18"/><polyline points="21,6 15,12 21,18"/></svg></button>
        </div>
      </div>

      <div id="fwrap">
        <button id="ftab" aria-label="Tampilkan atau sembunyikan kecepatan"><svg viewBox="0 0 24 24"><polyline points="6,9 12,15 18,9"/></svg></button>
        <div id="fbar">
          <button class="fb" data-f="1">F1</button>
          <button class="fb" data-f="2">F2</button>
          <button class="fb" data-f="3">F3</button>
          <button class="fb" data-f="4">F4</button>
        </div>
      </div>
    </div>

    <div class="pad" id="padR">
      <button class="half lf" data-k="l" aria-label="Kiri"><svg class="chev" viewBox="0 0 24 24"><polyline points="16,4 8,12 16,20"/></svg></button>
      <button class="half rt" data-k="r" aria-label="Kanan"><svg class="chev" viewBox="0 0 24 24"><polyline points="8,4 16,12 8,20"/></svg></button>
      <div class="divV"></div>
    </div>
  </div>

  <div id="ipov">
    <div id="ipbox">
      <h3>Koneksi robot</h3>
      <input id="ip" type="text" inputmode="decimal" placeholder="IP robot, mis. 192.168.1.20">
      <div class="row"><button id="go">Hubungkan</button><button class="g" id="close">Tutup</button></div>
      <div id="ipst">Isi IP dari Serial Monitor. Perangkat ini harus satu jaringan dengan robot.</div>
    </div>
  </div>

  <script>
'use strict';

const $ = id => document.getElementById(id);

const WS_PORT = 81;
const HB_MS = 150;                 // kirim ulang perintah tiap 150 ms selama tombol ditahan
const STALE_MS = 3000;             // dianggap putus kalau tidak ada data 3 detik

const STOP = { W: 'T', U: 'T', X: 'Y', V: 'Y' };   // perintah berhenti untuk servo

let HOST = '';
let BASE = '';
let ws = null;
let wsOK = false;
let reconnectT = null;
let lastData = 0;
let robotInfo = '';
let polling = false;

const st = { u: 0, d: 0, l: 0, r: 0 };
const holds = {};
let curCmd = 'S';
let hb = null;

/* ================= koneksi ================= */
function cleanHost(v) {
  return v.trim().replace(/^(https?|wss?):\/\//, '').replace(/[\/:].*$/, '');
}

function connect(v) {
  const h = cleanHost(v);
  if (!h) { HOST = ''; BASE = ''; return; }
  HOST = h;
  BASE = 'http://' + h;
  try { localStorage.setItem('robotip', h); } catch (e) {}
  lastData = 0;
  robotInfo = '';
  openWS();
  pollHTTP();
}

function openWS() {
  clearTimeout(reconnectT);
  if (ws) {
    ws.onopen = ws.onclose = ws.onmessage = ws.onerror = null;
    try { ws.close(); } catch (e) {}
  }
  wsOK = false;
  if (!HOST) return;
  try {
    ws = new WebSocket('ws://' + HOST + ':' + WS_PORT + '/');
  } catch (e) {
    scheduleReconnect();
    return;
  }
  ws.onopen = () => { wsOK = true; };
  ws.onmessage = e => {
    lastData = Date.now();
    try { render(JSON.parse(e.data)); } catch (x) {}
  };
  ws.onclose = () => { wsOK = false; scheduleReconnect(); };
  ws.onerror = () => {};
}

function scheduleReconnect() {
  clearTimeout(reconnectT);
  if (HOST) reconnectT = setTimeout(openWS, 1500);
}

// Perintah: lewat WebSocket kalau tersambung, kalau tidak lewat HTTP
function send(c) {
  if (!HOST) return;
  if (wsOK && ws && ws.readyState === 1) { ws.send(c); return; }
  fetch(BASE + '/api/cmd?c=' + encodeURIComponent(c), { mode: 'no-cors' }).catch(() => {});
}

// Cadangan: baca status lewat HTTP kalau WebSocket belum tersambung
async function pollHTTP() {
  if (polling || !HOST || wsOK) return;
  polling = true;
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), 2500);
  try {
    const r = await fetch(BASE + '/api/status?t=' + Date.now(), { signal: ctl.signal });
    const s = await r.json();
    lastData = Date.now();
    render(s);
  } catch (e) { /* diam */ }
  finally { clearTimeout(t); polling = false; }
}
setInterval(pollHTTP, 1000);

/* ================= tampilan koneksi ================= */
function updateConnUI() {
  const ok = HOST && (Date.now() - lastData < STALE_MS);
  $('conn').className = 'rbtn' + (ok ? ' ok' : '');
  $('badge').innerHTML = ok ? '&#10003;' : '&times;';
  let msg;
  if (!HOST) msg = 'Isi IP robot lalu tekan Hubungkan.';
  else if (ok) msg = 'Terhubung (' + (wsOK ? 'WebSocket' : 'HTTP') + ')' + (robotInfo ? ' - ' + robotInfo : '');
  else msg = 'Tidak tersambung. Cek IP, jaringan, dan pastikan robot menyala.';
  $('ipst').textContent = msg;
}
setInterval(updateConnUI, 500);

$('conn').onclick = () => $('ipov').classList.add('show');
$('close').onclick = () => $('ipov').classList.remove('show');
$('go').onclick = () => { connect($('ip').value); };
$('ip').addEventListener('keydown', e => { if (e.key === 'Enter') connect(e.target.value); });

/* ================= gerak robot ================= */
function setDrive(c, force) {
  if (c === curCmd && !force) return;
  curCmd = c;
  send(c);
  if (c === 'S') { clearInterval(hb); hb = null; }
  else if (!hb) { hb = setInterval(() => send(curCmd), HB_MS); }
}

function fromState() {
  const v = st.u - st.d, h = st.r - st.l;
  if (v > 0 && h < 0) return 'H';
  if (v > 0 && h > 0) return 'G';
  if (v < 0 && h < 0) return 'J';
  if (v < 0 && h > 0) return 'I';
  if (v > 0) return 'F';
  if (v < 0) return 'B';
  if (h < 0) return 'L';
  if (h > 0) return 'R';
  return 'S';
}

function drive() { setDrive(fromState()); }

document.querySelectorAll('[data-k]').forEach(b => {
  const k = b.dataset.k;
  b.addEventListener('pointerdown', e => {
    e.preventDefault();
    try { b.setPointerCapture(e.pointerId); } catch (x) {}
    st[k] = 1;
    b.classList.add('on');
    drive();
  });
  const up = () => { st[k] = 0; b.classList.remove('on'); drive(); };
  b.addEventListener('pointerup', up);
  b.addEventListener('pointercancel', up);
  b.addEventListener('lostpointercapture', up);
});

/* ================= lengan & capit: gerak terus selama ditahan ================= */
function holdStart(c) {
  if (holds[c]) return;
  send(c);
  holds[c] = setInterval(() => send(c), HB_MS);
}
function holdEnd(c) {
  if (!holds[c]) return;
  clearInterval(holds[c]);
  delete holds[c];
  send(STOP[c]);
}

document.querySelectorAll('[data-h]').forEach(b => {
  const c = b.dataset.h;
  b.addEventListener('pointerdown', e => {
    e.preventDefault();
    try { b.setPointerCapture(e.pointerId); } catch (x) {}
    b.classList.add('on');
    holdStart(c);
  });
  const up = () => { b.classList.remove('on'); holdEnd(c); };
  b.addEventListener('pointerup', up);
  b.addEventListener('pointercancel', up);
  b.addEventListener('lostpointercapture', up);
});

/* ================= STOP darurat ================= */
$('stop').addEventListener('pointerdown', e => {
  e.preventDefault();
  for (const k in st) st[k] = 0;
  document.querySelectorAll('[data-k],[data-h]').forEach(b => b.classList.remove('on'));
  for (const c in holds) holdEnd(c);
  setDrive('S', true);
  send('S');
});

/* ================= F1-F4 ================= */
function showF(m) {
  document.querySelectorAll('[data-f]').forEach(b => b.classList.toggle('on', +b.dataset.f === m));
}
document.querySelectorAll('[data-f]').forEach(b => {
  b.addEventListener('click', () => { showF(+b.dataset.f); send(b.dataset.f); });
});
$('ftab').onclick = () => $('fwrap').classList.toggle('hide');

/* ================= keyboard (untuk laptop) ================= */
const KM = { ArrowUp: 'u', w: 'u', ArrowDown: 'd', s: 'd', ArrowLeft: 'l', a: 'l', ArrowRight: 'r', d: 'r' };
const SK = { q: 'W', e: 'U', z: 'X', c: 'V' };
const keyName = e => (e.key.length === 1 ? e.key.toLowerCase() : e.key);

addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  const k = keyName(e);
  if (KM[k]) { e.preventDefault(); st[KM[k]] = 1; drive(); return; }
  if (k === ' ') { e.preventDefault(); setDrive('S', true); return; }
  if (SK[k]) { e.preventDefault(); holdStart(SK[k]); return; }
  if (!e.repeat && k >= '1' && k <= '4') { showF(+k); send(k); }
});
addEventListener('keyup', e => {
  const k = keyName(e);
  if (KM[k]) { st[KM[k]] = 0; drive(); }
  if (SK[k]) holdEnd(SK[k]);
});

function stopAll() {
  for (const k in st) st[k] = 0;
  for (const c in holds) holdEnd(c);
  setDrive('S', true);
}
addEventListener('blur', stopAll);
document.addEventListener('visibilitychange', () => { if (document.hidden) stopAll(); });
addEventListener('contextmenu', e => e.preventDefault());

/* ================= tampilan status robot ================= */
function setChip(el, cls) { el.className = 'chip ' + cls; }

function render(s) {
  robotInfo = s.mode + ' ' + s.ip;
  $('obj').textContent = (s.obj === null) ? '--' : s.obj.toFixed(1) + '\u00b0C';
  $('amb').textContent = (s.amb === null) ? '' : 'amb ' + s.amb.toFixed(1) + '\u00b0';

  const w = (s.waktu || '').split(' ');
  $('jam').textContent = w[1] || 'RTC error';
  setChip($('cTime'), w[1] ? '' : 'bad');

  if (s.sd) { setChip($('cSd'), 'ok'); $('sdtxt').textContent = 'Menyimpan ' + s.sdn; }
  else { setChip($('cSd'), 'warn'); $('sdtxt').textContent = 'Tanpa kartu'; }

  $('angL').textContent = s.lengan + '\u00b0';
  $('angC').textContent = s.capit + '\u00b0';
  showF(s.fmode);
}

/* ================= mulai ================= */
try {
  const v = localStorage.getItem('robotip');
  if (v) { $('ip').value = v; connect(v); }
  else { $('ipov').classList.add('show'); }
} catch (e) {
  $('ipov').classList.add('show');
}
updateConnUI();
  </script>
</body>
</html>
